name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp cox_hr.py _site/cox_hr.py
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          ok=0
          for i in {1..20}; do
            if curl --fail --silent --show-error --location "$base/" -o /tmp/index.html; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" -eq 1
          grep -q "Cox Hazard Ratio Calculator" /tmp/index.html
          grep -q "pyodide" /tmp/index.html

          curl --fail --silent --show-error --location "$base/cox_hr.py" -o /tmp/cox_hr.py
          grep -q "def cox_ph" /tmp/cox_hr.py
