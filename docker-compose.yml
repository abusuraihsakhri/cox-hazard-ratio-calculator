services:
  cox-hazard-ratio-calculator:
    build: .
    container_name: cox-hazard-ratio-calculator
    ports:
      - "8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
